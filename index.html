<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog Karya MMB — Edisi Pustaka UI (Latihan P09)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-md bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <img src="assets/logo.svg" alt="" width="32" height="32">
        Katalog Karya
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#menuUtama"
              aria-controls="menuUtama" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Galeri</a></li>
          <li class="nav-item"><a class="nav-link" href="#tentang">Tentang</a></li>
        </ul>
        <button id="tombolTema" class="btn btn-outline-secondary btn-sm" type="button">Mode gelap</button>
      </div>
    </div>
  </nav>
 
  <main class="container py-4">
    <h1 class="h3 mb-3">Karya Mahasiswa 3 D3 MM B</h1>
    <div id="galeri" class="row g-3"></div>
    <section id="tentang" class="mt-5">
      <h2 class="h5">Tentang</h2>
      <p class="text-body-secondary">Data karya pada halaman ini fiktif, dibuat untuk latihan.</p>
    </section>
  </main>
 
  <div class="modal fade" id="modalDetail" tabindex="-1" aria-labelledby="judulDetail" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="judulDetail" data-judul></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body" data-isi></div>
      </div>
    </div>
  </div>
 
  <script src="data.js" defer></script>
  <script src="ui-pustaka.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
